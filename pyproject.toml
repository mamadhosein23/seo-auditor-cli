[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-auditor-cli"
version = "0.1.0"
description = "A small SEO and browser-performance auditing CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40,<2",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
seo-auditor = "auditor.cli:main"

[tool.setuptools.packages.find]
include = ["auditor*"]
